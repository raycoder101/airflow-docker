x-airflow-common: &airflow-common
  build: .
  image: custom-airflow:3.0.0

  # Join the Kafka Docker network so Airflow can reach kafka:29092 directly.
  # Kafka advertises localhost:9092 for its external listener, so host.docker.internal
  # causes a metadata redirect back to localhost inside the container. Using the
  # internal listener kafka:29092 on the shared network avoids that entirely.
  networks:
    - default
    - kafka_network

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # AWS credentials for S3 upload and Glue job trigger
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    # Lakehouse config — populated after `terraform apply`
    LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET}
    GLUE_JOB_NAME: ${GLUE_JOB_NAME}
    KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:29092}
    KAFKA_TOPIC: ${KAFKA_TOPIC:-test-events}
    KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-airflow-iceberg-consumer}

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}

    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${SECRET_KEY}

    # ✅ Auth (ONLY FAB)
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__FAB__AUTH_TYPE: basic
    AIRFLOW__FAB__AUTH_USER_REGISTRATION_ROLE: Admin
    AIRFLOW__FAB__UPDATE_PERMS: "False"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

    # ✅ Execution API
    AIRFLOW__CORE__EXECUTION_API_ENABLED: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution
    AIRFLOW__API_AUTH__JWT_SECRET: ${SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_EXPIRATION_TIME: 86400  # seconds (24h); task heartbeats survive overnight Mac sleep
    AIRFLOW__WORKERS__JWT_EXPIRATION_TIME: 86400   # task execution token — must outlive the longest task

    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: 1800

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 5
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 5
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 30

    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: 8793

    # ── DBT config ───────────────────────────────────────────────────────────
    DBT_PROFILES_DIR: /opt/airflow/dbt-lakehouse
    ATHENA_WORKGROUP: ${ATHENA_WORKGROUP:-lakehouse-dev}
    ATHENA_RESULTS_BUCKET: ${ATHENA_RESULTS_BUCKET:-lakehouse-dev-athena-results-raycoder101}

    # ── GX config ────────────────────────────────────────────────────────────
    GX_ROOT: /opt/airflow/gx-lakehouse/gx

  volumes:
    - ./dags:/opt/airflow/dags:delegated
    - ./tests:/opt/airflow/tests
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./scripts:/opt/airflow/scripts:ro
    - ../dbt-lakehouse:/opt/airflow/dbt-lakehouse
    - ../gx-lakehouse:/opt/airflow/gx-lakehouse


services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5


  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs

        airflow db migrate

        airflow users create \
          --username ${AIRFLOW_UI_USERNAME} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password ${AIRFLOW_UI_PASSWORD} || true

        airflow users list

    depends_on:
      postgres:
        condition: service_healthy


  airflow-api-server:
    <<: *airflow-common
    restart: unless-stopped
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        exec airflow api-server --port 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    hostname: airflow-scheduler
    entrypoint: /bin/bash
    command:
      - -c
      - airflow scheduler
    ports:
      - "8793:8793"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy


  airflow-dag-processor:
    <<: *airflow-common
    restart: unless-stopped
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow dag-processor &
        DAG_PROC_PID=$$!
        sleep 120
        while kill -0 $$DAG_PROC_PID 2>/dev/null; do
          sleep 60
          if ! python3 /opt/airflow/scripts/dag_processor_healthcheck.py 2>/dev/null; then
            echo "DAGs are stale — exiting to trigger container restart"
            kill $$DAG_PROC_PID
            exit 1
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


  airflow-triggerer:
    <<: *airflow-common
    restart: unless-stopped
    entrypoint: /bin/bash
    command:
      - -c
      - airflow triggerer
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


  airflow-test:
    <<: *airflow-common
    command: bash -c "pytest /opt/airflow/tests"
    profiles:
      - test


volumes:
  postgres-db-volume:

networks:
  default: {}
  kafka_network:
    external: true
    name: kafka-docker_default